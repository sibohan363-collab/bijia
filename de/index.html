p{margin:4px 0}.muted{color:var(--mut)}

.sig{color:var(--mut);font-size:13px}.sig b{color:#d97757}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}

.cd{margin:10px 0 0;padding:8px 12px;border-radius:10px;background:#111;color:#ffcc00;font-weight:600;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.ask{display:flex;gap:8px}.ask input{flex:1;min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--in);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{width:100%;min-height:70px}
.btn{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;background:var(--acc);color:#fff;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}.btn.sm{padding:6px 12px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;background:transparent;color:var(--ink);cursor:pointer}
.note{font-size:13px;color:var(--mut);margin-top:6px}
.empty{text-align:center;color:var(--mut);padding:10px 0}
.item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0;padding-top:0}
.ih{display:flex;gap:8px;align-items:center}

.nm{flex:1;min-width:0;font-weight:700;border-color:transparent;background:transparent;padding:6px}
.nm:focus{border-color:var(--line);background:var(--in)}
.x{border:0;background:transparent;color:var(--mut);font-size:22px;cursor:pointer;padding:0 6px;line-height:1}
.qty{display:inline-flex;align-items:center;gap:4px}.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--in);color:var(--ink);font-size:17px;cursor:pointer}

.meta select{font-size:13px;padding:3px 6px;border-radius:8px}
.meta a{color:var(--acc)}
.rows{display:grid;gap:6px;margin-left:30px}
.row{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.row.best{border-color:var(--acc);background:var(--accbg)}
.row a{flex:1;min-width:0;color:var(--ink);text-decoration:none;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row a::after{content:" ↗";color:var(--acc);font-weight:400}
.row input{width:112px;padding:7px 8px;text-align:right}
.row .tag{font-size:12px;color:var(--acc);font-weight:700;white-space:nowrap}
.row .tag.bad{color:var(--bad)}
.more{margin:6px 0 0 30px}
details>summary{cursor:pointer;color:var(--acc);font-size:14px;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ "}details[open]>summary::before{content:"▾ "}

.low{display:flex;align-items:center;gap:8px;font-size:13px}.low span{flex:1}.low input{width:112px;padding:6px 8px;text-align:right}
.v{font-size:12px;padding:2px 6px;border-radius:6px}.v.ok{background:var(--accbg);color:var(--acc)}.v.bad{background:var(--badbg);color:var(--bad)}

.addshop select{font-size:14px;padding:6px 8px;margin:6px 0 0 30px}
.big{font-size:30px;font-weight:800}
.save{color:var(--acc);font-weight:700}
.ord{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:8px 0}.ord:first-of-type{border-top:0}
.ord b{white-space:nowrap}.ord small{display:block;color:var(--mut)}
.hint{color:var(--warn);font-size:13px}
.warn{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:14px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:2px 0}td:last-child{text-align:right;white-space:nowrap}
.fold{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.fold>summary{font-size:15px;font-weight:600;color:var(--ink)}
.shop{border-top:1px solid var(--line);padding:8px 0}
.sf{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-top:4px}
.sf label{display:flex;flex-direction:column;font-size:12px;color:var(--mut)}.sf input{width:100%;padding:7px 8px}
.ck{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:4px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:18px}
@media (max-width:520px){.rows,.meta,.more,.addshop select{margin-left:0}.row input{width:100px}.big{font-size:26px}}

function num(raw){let s=String(raw??'').replace(/[€\s]/g,'');if(!s)return null;

  const v=parseFloat(s);return isFinite(v)&&v>=0?r2(v):null;}

// ---- input: a name or a share link ----
function parse(text){
  const m=text.match(/https?:\/\/[^\s"'<>，。）)]+/i);const url=m?m[0]:'';let host='';
  try{host=url?new URL(url).hostname.replace(/^(www\d?|m)\./,''):'';}catch(e){}
  const src=host?(SHOPS.find(s=>s.h.some(h=>host===h||host.endsWith('.'+h)))||{id:'other'}).id:null;
  let name=text.replace(url,' ').replace(/(Schau dir (das|dies|diesen Artikel) an|Sieh dir (das|dies) an|Check (this|it) out|bei Amazon\.de|auf Amazon|Jetzt ansehen)[:!]?/gi,' ')
    .replace(/[「」【】"“”]/g,' ').replace(/\s+/g,' ').trim().replace(/^[-:|,]+|[-:|,]+$/g,'').trim();
  if(!name&&url){try{const segs=new URL(url).pathname.split('/').filter(x=>/[a-z]/i.test(x)&&/[-_]/.test(x));const b=segs.sort((a,c)=>c.length-a.length)[0];
    if(b)name=decodeURIComponent(b).replace(/\.html?$/,'').replace(/^_+/,'').replace(/[-_]+/g,' ').replace(/\s+\d{5,}.*$/,'').replace(/\s+(?=[A-Z0-9]*\d)[A-Z0-9]{6,}$/,'').trim();}catch(e){}}
  if(name.length>110)name=name.slice(0,110)+'…';
  return {url,src,name};}
function add(text){
  const v=String(text||'').trim();if(!v){msg(t('emptyQ'));return;}
  const p=parse(v);
  if(!p.url&&!/[A-Za-zÀ-ÿ一-鿿]{2,}/.test(v)){msg(t('needName'));return;}
  if(p.url&&S.items.some(i=>i.url===p.url)){msg(t('dup'));return;}
  const cat=guessCat(p.name||'');const ids=[...new Set([...(p.src&&p.src!=='other'?[p.src]:[]),...CATS[cat]])];
  if(p.src==='other')ids.push('other');
  const it={id:uid(),name:p.name||t('unknown'),url:p.url,src:p.src,cat,qty:1,on:true,asin:p.src==='amazon'?asinOf(p.url):'',offers:{}};
  ids.forEach(id=>{it.offers[id]={p:null,low:null};});
  S.items.unshift(it);document.getElementById('q').value='';
  msg(t('added',it.name,ids.length,T[S.lang].catNames[cat]));render();

// ---- maths ----
function orderCost(sid,lines){
  const c=cfg(sid);const sub=r2(lines.reduce((a,l)=>a+l.p*l.qty,0));
  let v=0;const hasV=c.vAmt||c.vPct;if(hasV&&sub>=(c.vMin||0))v=r2(Math.min(sub,(c.vAmt||0)+sub*(c.vPct||0)/100));
  let ship=c.ship||0;if(sid==='amazon'&&S.prime)ship=0;if(ship&&c.free&&sub-v>=c.free)ship=0;
  const pay=r2(sub-v+ship),cb=r2((sub-v)*(c.cb||0)/100);
  return {sid,lines,sub,v,ship,pay,cb,net:r2(pay-cb),freeGap:(ship&&c.free)?r2(c.free-(sub-v)):0,vGap:(hasV&&!v&&c.vMin)?r2(c.vMin-sub):0};}
function evalA(units,ch){const by={};units.forEach((u,i)=>{const o=u.opts[ch[i]];(by[o.sid]=by[o.sid]||[]).push({it:u.it,p:o.p,qty:u.it.qty});});
  const orders=Object.keys(by).map(s=>orderCost(s,by[s]));const sum=k=>r2(orders.reduce((a,o)=>a+o[k],0));return {orders,pay:sum('pay'),cb:sum('cb'),net:sum('net')};}
function solve(){
  const units=S.items.filter(i=>i.on).map(it=>({it,opts:Object.entries(it.offers).filter(([,o])=>o.p>0).map(([sid,o])=>({sid,p:o.p})).sort((a,b)=>a.p-b.p)})).filter(u=>u.opts.length);
  if(!units.length)return null;
  const cheap=units.map(()=>0),base=evalA(units,cheap);let best=base,bestC=cheap.slice();
  const better=(r,b)=>r.net<b.net-0.001||(Math.abs(r.net-b.net)<0.001&&r.orders.length<b.orders.length);
  if(units.reduce((a,u)=>a*u.opts.length,1)<=200000){const c=units.map(()=>0);
    (function dfs(i){if(i===units.length){const r=evalA(units,c);if(better(r,best)){best=r;bestC=c.slice();}return;}for(let k=0;k<units[i].opts.length;k++){c[i]=k;dfs(i+1);}})(0);}
  else{const sids=[...new Set(units.flatMap(u=>u.opts.map(o=>o.sid)))];
    for(const st of [cheap,...sids.map(s=>units.map(u=>Math.max(0,u.opts.findIndex(o=>o.sid===s))))]){let c=st.slice(),cur=evalA(units,c),imp=true;
      while(imp){imp=false;for(let i=0;i<units.length;i++)for(let k=0;k<units[i].opts.length;k++){if(k===c[i])continue;const o=c[i];c[i]=k;const r=evalA(units,c);if(r.net<cur.net-0.001){cur=r;imp=true;}else c[i]=o;}}
      if(better(cur,best)){best=cur;bestC=c.slice();}}}
  const chosen={};units.forEach((u,i)=>{chosen[u.it.id]=u.opts[bestC[i]].sid;});
  return {best,base,chosen};}

function countdown(){
  const today=new Date().toLocaleDateString('en-CA',{timeZone:'Europe/Berlin'}),y=+today.slice(0,4),td=new Date(today+'T00:00:00Z');
  const bfOf=y=>{const d=new Date(Date.UTC(y,10,1));const th=(4-d.getUTCDay()+7)%7;return new Date(Date.UTC(y,10,1+th+22));};
  const bf=bfOf(y),cm=new Date(bf.getTime()+3*864e5);
  const f=d=>d.toLocaleDateString(S.lang==='de'?'de-DE':'zh-CN',{timeZone:'UTC',month:'long',day:'numeric',weekday:'short'});
  const d1=Math.round((bf-td)/864e5),d2=Math.round((cm-td)/864e5);
  document.getElementById('cd').textContent='⏳ '+(d1>0?t('cdBefore',f(bf),d1,f(cm)):d1===0?t('cdToday',f(cm)):d2>0?t('cdBetween',f(cm)):d2===0?t('cdCM'):t('cdAfter',f(bfOf(y+1))));}

   <div class="meta">${t('cat')} <select data-act="cat" data-id="${it.id}">${Object.keys(CATS).map(k=>`<option value="${k}"${k===it.cat?' selected':''}>${T[S.lang].catNames[k]}</option>`).join('')}</select>
     · <a href="https://www.idealo.de/preisvergleich/MainSearchProductCategory.html?q=${q}" target="_blank" rel="noopener">idealo ↗</a>

   <div class="rows">${rows}</div>
   ${free.length?`<div class="addshop"><select data-act="adds" data-id="${it.id}"><option value="">${t('addShop')}</option>${free.map(s=>`<option value="${s.id}">${esc(s.n)}</option>`).join('')}</select></div>`:''}

function planHTML(sol){

  const b=sol.best,saved=r2(sol.base.net-b.net);

      ${o.freeGap>0?`<small class="hint">${t('freeGap',eur(o.freeGap))}</small>`:''}${o.vGap>0?`<small class="hint">${t('vGap',eur(o.vGap))}</small>`:''}</div><b>${eur(o.pay)}</b></div>`).join('');

const b64e=s=>btoa(unescape(encodeURIComponent(s))),b64d=s=>decodeURIComponent(escape(atob(s)));
document.getElementById('expBtn').onclick=async()=>{const code='BFDE2:'+b64e(JSON.stringify({items:S.items,cfg:S.cfg,prime:S.prime}));const box=document.getElementById('code');box.value=code;box.select();
  let ok=false;try{await navigator.clipboard.writeText(code);ok=true;}catch(e){}document.getElementById('syncMsg').textContent=t(ok?'copied':'expOk');};
document.getElementById('impBtn').onclick=()=>{const v=document.getElementById('code').value.trim();let o=null;try{if(/^BFDE[12]:/.test(v))o=JSON.parse(b64d(v.slice(6)));}catch(e){}
  if(!o||!Array.isArray(o.items)){document.getElementById('syncMsg').textContent=t('impBad');return;}
  o.items.forEach(i=>{if(!i.cat)i.cat=guessCat(i.name||'');});S.items=o.items;S.cfg=o.cfg||{};S.prime=!!o.prime;document.getElementById('syncMsg').textContent=t('impOk');render();};
document.getElementById('resetBtn').onclick=()=>{S.items=[];S.cfg={};document.getElementById('syncMsg').textContent=t('resetOk');render();};

S=load();applyLang();render();
</script>
</body>
</html>
