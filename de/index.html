<style>

*{box-sizing:border-box}

.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}

.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--accbg);color:var(--acc);font-size:13px}
.cd{margin:8px 0;padding:10px 12px;border-radius:10px;background:#111;color:#ffcc00;font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
details.panel>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::after{content:"▾";color:var(--acc)}details[open].panel>summary::after{content:"▴"}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--warnbg);color:var(--warn)}

.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:14px}
.note{font-size:13px;color:var(--mut);margin-top:6px}
.item{border-top:1px solid var(--line);padding:12px 0}
.ih{display:flex;gap:8px;align-items:center}
.ih input[type=checkbox]{width:22px;height:22px;flex:none}
.ih .nm{flex:1;min-width:0;font-weight:600}
.x{border:0;background:transparent;color:var(--mut);font-size:20px;cursor:pointer;padding:0 6px}
.qty{display:inline-flex;align-items:center;gap:4px}.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--in);color:var(--ink);font-size:18px;cursor:pointer}
.links{font-size:13px;margin:4px 0 0 30px;display:flex;gap:12px;flex-wrap:wrap}
a{color:var(--acc)}
.offers{margin:8px 0 0 30px;display:grid;gap:8px}
.row{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.row.best{border-color:var(--acc)}
.rh{display:flex;align-items:center;gap:8px}.rh b{flex:1}
.rf{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.rf label{display:flex;flex-direction:column;font-size:12px;color:var(--mut)}
.rf input{width:130px}
.v{font-size:13px;margin-top:4px;padding:3px 8px;border-radius:6px;display:inline-block}
.v.ok{background:var(--accbg);color:var(--acc)}.v.bad{background:var(--badbg);color:var(--bad)}
.addshop{margin:8px 0 0 30px}
.shops{display:grid;gap:10px;margin-top:8px}
.shop{border:1px solid var(--line);border-radius:10px;padding:10px}
.sf{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:6px}
.sf label{display:flex;flex-direction:column;font-size:12px;color:var(--mut)}.sf input{width:100%}
.big{font-size:30px;font-weight:700}
.save{color:var(--acc);font-weight:600}
.order{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px}
.order table{width:100%;border-collapse:collapse;font-size:14px}.order td{padding:2px 0}.order td:last-child{text-align:right;white-space:nowrap}
.order .tot td{border-top:1px solid var(--line);font-weight:700;padding-top:4px}
.hint{font-size:13px;color:var(--warn)}
.warns p{font-size:14px}
.ck{display:flex;gap:8px;align-items:center;margin-top:6px}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:20px}
@media (max-width:520px){.offers,.links,.addshop{margin-left:0}.ih{flex-wrap:wrap}.ih .nm{order:5;flex-basis:100%}.ih .qty{margin-left:auto}.rf input{width:110px}.big{font-size:26px}}

</head>

 how:'<h3>Auf den Startbildschirm legen</h3><p><b>iPhone:</b> In Safari öffnen → Teilen-Symbol unten → „Zum Home-Bildschirm“.</p><p><b>Android:</b> In Chrome öffnen → ⋮ oben rechts → nach unten scrollen → „Installieren“ bzw. „Zum Startbildschirm hinzufügen“.</p><h3>Produkte hinzufügen</h3><p>1. In der App von Amazon, MediaMarkt, Douglas usw. das Produkt öffnen → Teilen → Link kopieren.</p><p>2. Hier lange ins Feld tippen → Einfügen → „Erkennen und hinzufügen“. Du kannst auch einfach den Produktnamen eintippen.</p><p>3. Für jeden Shop den Preis eintragen, dazu den „niedrigsten Preis der letzten 30 Tage“ von der Produktseite – so siehst du, ob der Rabatt echt ist.</p><p>4. Unter „Versand & Rabatte der Shops“ Versandkosten, Grenze für Gratisversand, Gutschein und Cashback laut Kasse eintragen.</p><h3>Ergebnis ansehen, selbst bestellen</h3><p>Die Seite zeigt, in welchem Shop du was am günstigsten kaufst. Mit „Produkt öffnen“ gehst du zum Shop und bestellst dort selbst.</p><p class="muted">Ohne Anmeldung. Deine Daten bleiben nur auf deinem Gerät – jede Person hat ihre eigene Liste. Gerät wechseln: „Export / Import“.</p>',

let S=null;
const r2=x=>Math.round(x*100)/100;

function num(raw){let s=String(raw==null?'':raw).replace(/[€\s]/g,'');if(!s)return null;
  if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(','))s=s.replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const v=parseFloat(s);return isFinite(v)&&v>=0?r2(v):null;}

    it('Parfum 100 ml',{douglas:{p:84.95,low:84.95},flaconi:{p:82.95,low:82.95},amazon:{p:86,low:86}})],
   cfg:{mindfactory:{ship:6.99},alternate:{ship:5.99,vAmt:25,vMin:1000},amazon:{ship:3.99,free:39},douglas:{ship:4.95,free:39,cb:3},flaconi:{ship:4.95,free:99}}};
}
function load(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
  const lang=(navigator.language||'').toLowerCase().startsWith('de')?'de':'zh';
  if(s&&Array.isArray(s.items))return Object.assign({lang,prime:false,demo:false,cfg:{}},s);
  const d=demo();return {lang,items:d.items,cfg:d.cfg,prime:false,demo:true};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const cfg=id=>S.cfg[id]||(S.cfg[id]={});

// ---- parsing a share text ----
function parse(text){
  const m=text.match(/https?:\/\/[^\s"'<>，。）)]+/i);const url=m?m[0]:'';let host='';
  try{host=url?new URL(url).hostname.replace(/^www\.|^m\./,''):'';}catch(e){}
  const shop=host?(SHOPS.find(s=>s.h.some(h=>host===h||host.endsWith('.'+h)))||{id:'other'}).id:null;
  let name=text.replace(url,' ').replace(/(Schau dir (das|dies|diesen Artikel) an|Sieh dir (das|dies) an|Check (this|it) out|bei Amazon\.de|auf Amazon|Ich habe .* gefunden|Teilen|Jetzt ansehen)[:!]?/gi,' ')
    .replace(/[「」【】"“”]/g,' ').replace(/\s+/g,' ').trim().replace(/^[-:|,]+|[-:|,]+$/g,'').trim();
  if(!name&&url){try{const segs=new URL(url).pathname.split('/').filter(x=>/[a-z]/i.test(x)&&/[-_]/.test(x));
      const best=segs.sort((a,b)=>b.length-a.length)[0];
      if(best)name=decodeURIComponent(best).replace(/\.html?$/,'').replace(/^_+/,'').replace(/[-_]+/g,' ').replace(/\s+\d{5,}.*$/,'').replace(/\s+(?=[A-Z0-9]*\d)[A-Z0-9]{6,}$/,'').trim();}catch(e){}}
  if(name.length>120)name=name.slice(0,120)+'…';
  return {url,shop,name};
}
function addFromText(){
  const box=document.getElementById('paste');const v=box.value.trim();
  if(!v){msg(t('addEmpty'));return;}
  const p=parse(v);
  if(p.url&&S.items.some(i=>i.url===p.url)){msg(t('addDup'));return;}
  const wasDemo=S.demo;
  if(S.demo){S.items=S.items.filter(i=>!i.demo);S.cfg={};S.demo=false;}
  const it={id:uid(),name:p.name||t('unknown'),url:p.url,src:p.shop,qty:1,on:true,offers:{}};
  if(p.shop)it.offers[p.shop]={p:null,low:null};
  S.items.push(it);box.value='';
  msg(t(wasDemo?'addOkDemo':'addOk',it.name,p.shop?shopName(p.shop):t('fromNone')));
  render();
  setTimeout(()=>{const e=document.querySelector(`[data-id="${it.id}"][data-f="p"]`);if(e)e.scrollIntoView({block:'center',behavior:'smooth'});},50);
}
const msg=s=>{document.getElementById('msg').textContent=s;};

// ---- the maths ----
function orderCost(shop,lines){
  const c=cfg(shop);const sub=r2(lines.reduce((a,l)=>a+l.p*l.qty,0));
  let v=0;const hasV=(c.vAmt||c.vPct);
  if(hasV&&sub>=(c.vMin||0))v=r2(Math.min(sub,(c.vAmt||0)+sub*(c.vPct||0)/100));
  let ship=c.ship||0;if(shop==='amazon'&&S.prime)ship=0;
  if(ship&&c.free&&sub-v>=c.free)ship=0;
  const pay=r2(sub-v+ship),cb=r2((sub-v)*(c.cb||0)/100);
  const freeGap=(ship&&c.free)?r2(c.free-(sub-v)):0,vGap=(hasV&&!v&&c.vMin)?r2(c.vMin-sub):0;
  return {shop,lines,sub,v,ship,pay,cb,net:r2(pay-cb),freeGap,vGap};
}
function evalAssign(units,choice){
  const by={};units.forEach((u,i)=>{const o=u.opts[choice[i]];(by[o.shop]=by[o.shop]||[]).push({it:u.it,p:o.p,qty:u.it.qty});});
  const orders=Object.keys(by).map(s=>orderCost(s,by[s]));
  return {orders,pay:r2(orders.reduce((a,o)=>a+o.pay,0)),cb:r2(orders.reduce((a,o)=>a+o.cb,0)),net:r2(orders.reduce((a,o)=>a+o.net,0))};
}
function solve(){
  const units=S.items.filter(i=>i.on).map(it=>({it,opts:Object.entries(it.offers).filter(([,o])=>o.p>0).map(([shop,o])=>({shop,p:o.p})).sort((a,b)=>a.p-b.p)})).filter(u=>u.opts.length);
  if(!units.length)return null;
  const cheap=units.map(()=>0);const base=evalAssign(units,cheap);
  let best=base,bestC=cheap.slice();
  const combos=units.reduce((a,u)=>a*u.opts.length,1);
  if(combos<=200000){const c=units.map(()=>0);
    (function dfs(i){if(i===units.length){const r=evalAssign(units,c);if(r.net<best.net-0.001||(Math.abs(r.net-best.net)<0.001&&r.orders.length<best.orders.length)){best=r;bestC=c.slice();}return;}
      for(let k=0;k<units[i].opts.length;k++){c[i]=k;dfs(i+1);}})(0);}
  else{const shops=[...new Set(units.flatMap(u=>u.opts.map(o=>o.shop)))];
    const starts=[cheap,...shops.map(s=>units.map(u=>{const k=u.opts.findIndex(o=>o.shop===s);return k<0?0:k;}))];
    for(const st of starts){let c=st.slice(),cur=evalAssign(units,c),improved=true;
      while(improved){improved=false;for(let i=0;i<units.length;i++)for(let k=0;k<units[i].opts.length;k++){if(k===c[i])continue;const old=c[i];c[i]=k;const r=evalAssign(units,c);if(r.net<cur.net-0.001){cur=r;improved=true;}else c[i]=old;}}
      if(cur.net<best.net-0.001){best=cur;bestC=c.slice();}}}
  return {best,base,units,bestC};
}

// ---- rendering ----
function countdown(){
  const today=new Date().toLocaleDateString('en-CA',{timeZone:'Europe/Berlin'});
  const bfOf=y=>{const d=new Date(Date.UTC(y,10,1));const th=(4-d.getUTCDay()+7)%7;return new Date(Date.UTC(y,10,1+th+21+1));};
  const y=+today.slice(0,4),td=new Date(today+'T00:00:00Z');
  let bf=bfOf(y);const cm=new Date(bf.getTime()+3*864e5);
  const f=d=>d.toLocaleDateString(S.lang==='de'?'de-DE':'zh-CN',{timeZone:'UTC',month:'long',day:'numeric',weekday:'short'});
  const days=Math.round((bf-td)/864e5),dcm=Math.round((cm-td)/864e5);
  let s;if(days>0)s=t('cdBefore',f(bf),days,f(cm));else if(days===0)s=t('cdToday',f(cm));else if(dcm>0)s=t('cdBetween',f(cm));else if(dcm===0)s=t('cdCM');else s=t('cdAfter',f(bfOf(y+1)));
  document.getElementById('cd').textContent='⏳ '+s;
}
function verdict(o){if(!(o.p>0))return `<span class="v">${t('vNoPrice')}</span>`;
  if(o.low>0){if(o.p>o.low+0.004)return `<span class="v bad">${t('vFake',eur(r2(o.p-o.low)))}</span>`;return `<span class="v ok">${t('vReal')}</span>`;}return '';}
function itemsHTML(sol){
  const chosen={};if(sol)sol.units.forEach((u,i)=>{chosen[u.it.id]=u.opts[sol.bestC[i]].shop;});
  return S.items.map(it=>{const q=encodeURIComponent(it.name);
    const rows=Object.keys(it.offers).map(sid=>{const o=it.offers[sid],sh=SHOPS.find(s=>s.id===sid);
      const link=it.src===sid&&it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener">${t('open')}</a>`:(sh&&sh.s?`<a href="${esc(sh.s(q))}" target="_blank" rel="noopener">${t('search')}</a>`:'');
      return `<div class="row${chosen[it.id]===sid&&it.on?' best':''}"><div class="rh"><b>${esc(shopName(sid))}</b>${link}<button class="x" data-act="rmo" data-id="${it.id}" data-s="${sid}" aria-label="×">×</button></div>
       <div class="rf"><label>${t('price')}<input inputmode="decimal" data-id="${it.id}" data-s="${sid}" data-f="p" value="${esc(shown(o.p))}"></label><label>${t('low30')}<input inputmode="decimal" data-id="${it.id}" data-s="${sid}" data-f="low" value="${esc(shown(o.low))}"></label></div>${verdict(o)}</div>`;}).join('');
    const free=SHOPS.filter(s=>!(s.id in it.offers));
    return `<div class="item"><div class="ih"><input type="checkbox" data-act="on" data-id="${it.id}" ${it.on?'checked':''}><input class="nm" data-id="${it.id}" data-f="name" value="${esc(it.name)}"><span class="qty"><button data-act="q-" data-id="${it.id}">−</button><b>${it.qty}</b><button data-act="q+" data-id="${it.id}">+</button></span><button class="x" data-act="del" data-id="${it.id}" aria-label="×">×</button></div>
      <div class="links">${it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener">${t('open')}</a>`:''}<a href="https://www.idealo.de/preisvergleich/MainSearchProductCategory.html?q=${q}" target="_blank" rel="noopener">${t('idealo')}</a></div>
      <div class="offers">${rows}</div>
      ${free.length?`<div class="addshop"><select data-act="adds" data-id="${it.id}"><option value="">${t('addShop')}</option>${free.map(s=>`<option value="${s.id}">${esc(shopName(s.id))}</option>`).join('')}</select></div>`:''}</div>`;}).join('');
}
function shopsHTML(){
  const ids=[...new Set(S.items.flatMap(i=>Object.keys(i.offers)))];
  if(!ids.length)return `<p class="note">${t('noShops')}</p>`;
  const f=(id,k)=>`<label>${t(k)}<input inputmode="decimal" data-c="${k}" data-s="${id}" value="${esc(shown(cfg(id)[k]))}"></label>`;
  return `<div class="shops">${ids.map(id=>`<div class="shop"><b>${esc(shopName(id))}</b>${id==='amazon'?`<label class="ck"><input type="checkbox" data-act="prime" ${S.prime?'checked':''}>${t('prime')}</label>`:''}<div class="sf">${['ship','free','vAmt','vPct','vMin','cb'].map(k=>f(id,k)).join('')}</div></div>`).join('')}</div>`;
}
function planHTML(sol){
  if(!sol)return `<h2>${t('planT')}</h2><p class="note">${t('planEmpty')}</p>`;
  const b=sol.best,saved=r2(sol.base.net-b.net);
  const ord=b.orders.map(o=>`<div class="order"><b>${t('orderAt',esc(shopName(o.shop)))}</b><table>
    ${o.lines.map(l=>`<tr><td>${esc(l.it.name)} ×${l.qty}</td><td>${eur(r2(l.p*l.qty))}</td></tr>`).join('')}
    ${o.v?`<tr><td>${t('vLine')}</td><td>−${eur(o.v)}</td></tr>`:''}
    ${o.ship?`<tr><td>${t('shipLine')}</td><td>+${eur(o.ship)}</td></tr>`:''}
    <tr class="tot"><td>${t('payLine')}</td><td>${eur(o.pay)}</td></tr>
    ${o.cb?`<tr><td class="muted">${t('cbLine')}</td><td class="muted">−${eur(o.cb)}</td></tr>`:''}</table>
    ${o.freeGap>0?`<p class="hint">${t('freeGap',eur(o.freeGap))}</p>`:''}${o.vGap>0?`<p class="hint">${t('vGap',eur(o.vGap))}</p>`:''}</div>`).join('');
  const warns=[];
  S.items.filter(i=>i.on).forEach(it=>Object.entries(it.offers).forEach(([sid,o])=>{if(o.p>0&&o.low>0&&o.p>o.low+0.004&&b.orders.some(od=>od.shop===sid&&od.lines.some(l=>l.it===it)))warns.push(t('warnFake',esc(it.name),esc(shopName(sid)),eur(r2(o.p-o.low))));}));
  if(b.cb)warns.push(t('warnCb'));warns.push(t('warnRet'));
  return `<h2>${t('planT')}</h2><p class="muted" style="margin-top:8px">${t('total')}</p><div class="big">${eur(b.pay)}</div>
   ${b.cb?`<p class="muted">${t('afterCb',eur(b.net))}</p>`:''}
   <p class="save">${saved>0.004?t('save',eur(saved)):t('same')}</p>${ord}
   <div class="warns"><h3>${t('warnT')}</h3>${warns.map(w=>`<p>· ${w}</p>`).join('')}</div>`;
}
function applyLang(){
  document.documentElement.lang=S.lang==='de'?'de':'zh-CN';
  document.querySelectorAll('[data-t]').forEach(e=>{e.innerHTML=T[S.lang][e.dataset.t]||'';});
  document.getElementById('paste').placeholder=t('pastePh');document.getElementById('code').placeholder=t('codePh');
  document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===S.lang));
}
function render(){
  const sol=solve();
  document.getElementById('items').innerHTML=itemsHTML(sol);
  document.getElementById('shops').innerHTML=shopsHTML();
  document.getElementById('plan').innerHTML=planHTML(sol);
  document.getElementById('demoBadge').hidden=!S.demo;document.getElementById('clearDemo').hidden=!S.demo;
  countdown();save();
}
const find=id=>S.items.find(i=>i.id===id);

// ---- events ----
document.addEventListener('change',e=>{const x=e.target,d=x.dataset;
  if(d.f&&d.id){const it=find(d.id);if(!it)return;
    if(d.f==='name'){it.name=x.value.trim()||t('unknown');}
    else{it.offers[d.s][d.f]=num(x.value);}
    render();return;}
  if(d.c&&d.s){cfg(d.s)[d.c]=num(x.value);render();return;}
  if(d.act==='on'){find(d.id).on=x.checked;render();return;}
  if(d.act==='prime'){S.prime=x.checked;render();return;}
  if(d.act==='adds'&&x.value){find(d.id).offers[x.value]={p:null,low:null};const sid=x.value;render();
    setTimeout(()=>{const el=document.querySelector(`[data-id="${d.id}"][data-s="${sid}"][data-f="p"]`);if(el)el.focus();},30);}
});
document.addEventListener('click',e=>{const x=e.target.closest('[data-act],[data-lang]');if(!x)return;const d=x.dataset;
  if(d.lang){S.lang=d.lang;applyLang();render();return;}
  const it=d.id&&find(d.id);
  if(d.act==='q+'&&it){it.qty=Math.min(99,it.qty+1);render();}
  if(d.act==='q-'&&it){it.qty=Math.max(1,it.qty-1);render();}
  if(d.act==='del'&&it){S.items=S.items.filter(i=>i!==it);render();}
  if(d.act==='rmo'&&it){delete it.offers[d.s];render();}
});
document.getElementById('addBtn').onclick=addFromText;
document.getElementById('sampleBtn').onclick=()=>{document.getElementById('paste').value='Schau dir das an: Kingston FURY Beast DDR5 32GB (2x16GB) 6000MT/s https://amzn.eu/d/0abcDEF';};
document.getElementById('clearDemo').onclick=()=>{S.items=S.items.filter(i=>!i.demo);S.cfg={};S.demo=false;msg('');render();};
const b64e=s=>btoa(unescape(encodeURIComponent(s))),b64d=s=>decodeURIComponent(escape(atob(s)));
document.getElementById('expBtn').onclick=async()=>{const code='BFDE1:'+b64e(JSON.stringify({items:S.items,cfg:S.cfg,prime:S.prime}));
  const box=document.getElementById('code');box.value=code;box.select();let ok=false;
  try{await navigator.clipboard.writeText(code);ok=true;}catch(e){}
  document.getElementById('syncMsg').textContent=t(ok?'copied':'expOk');};
document.getElementById('impBtn').onclick=()=>{const v=document.getElementById('code').value.trim();let o=null;
  try{if(v.startsWith('BFDE1:'))o=JSON.parse(b64d(v.slice(6)));}catch(e){}
  if(!o||!Array.isArray(o.items)){document.getElementById('syncMsg').textContent=t('impBad');return;}
  S.items=o.items;S.cfg=o.cfg||{};S.prime=!!o.prime;S.demo=false;document.getElementById('syncMsg').textContent=t('impOk');render();};
document.getElementById('resetBtn').onclick=()=>{S.items=[];S.cfg={};S.demo=false;document.getElementById('syncMsg').textContent=t('resetOk');render();};

S=load();applyLang();render();
</script>
